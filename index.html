<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f6f5b"><title>Mars 理專｜AI 股票研究中心</title><style>:root{--bg:#f4f7f6;--card:#fff;--text:#17332c;--muted:#6d7d78;--line:#dfe8e4;--green:#19765d;--red:#c65353;--yellow:#b27b18;--blue:#3b6ea8;--shadow:0 8px 24px #16352b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:center}.brand{font-weight:800;font-size:20px}.pill{padding:6px 10px;border-radius:999px;background:#eaf5f0;color:var(--green);font-size:12px;font-weight:700}.search{margin-left:auto;width:min(360px,45vw);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.wrap{max-width:1280px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.hero{grid-column:span 4}.hero h1{margin:0 0 8px;font-size:28px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--text);color:#fff}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.market b{font-size:22px}.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 12px}.stocks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stock{cursor:pointer}.stock-head{display:flex;justify-content:space-between;gap:8px}.ticker{font-weight:800;font-size:18px}.score{font-weight:900;font-size:20px}.bars{margin-top:12px;display:grid;gap:7px}.barrow{display:grid;grid-template-columns:82px 1fr 48px;gap:8px;align-items:center;font-size:12px}.bar{height:7px;background:#edf2f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.status{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#999}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.detail{display:none}.detail.show{display:block}.back{border:0;background:#eaf5f0;color:var(--green);border-radius:10px;padding:8px 12px;cursor:pointer}.metric{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.metric div{padding:12px;background:#f7faf9;border-radius:12px}.metric strong{display:block;font-size:20px;margin-top:4px}.note{padding:12px;border-left:4px solid var(--blue);background:#f3f7fb;border-radius:8px;font-size:13px;line-height:1.6}.footer{margin:28px 0;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:900px){.grid,.market{grid-template-columns:repeat(2,1fr)}.hero{grid-column:span 2}.stocks{grid-template-columns:1fr 1fr}.metric{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:14px}.grid,.market,.stocks{grid-template-columns:1fr}.hero{grid-column:span 1}.search{width:45%}.metric{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="brand">Mars 理專</div><span class="pill">AI 股票研究中心 v1</span><input id="search" class="search" placeholder="搜尋 AAPL / NVDA / 台積電…"></header><main class="wrap"><section id="home"><div class="grid"><div class="card hero"><h1>每天把「好公司」與「好價格」分開看</h1><p class="muted">ROE → 獲利 → 再投資 → 成長 → 現金流 → 估值。系統只在資料完整且通過一致性檢查時給出結論，不用示範數字冒充即時行情。</p><div class="status"><span id="dot" class="dot"></span><span id="dataStatus">正在檢查資料來源…</span></div></div></div><div class="tabs"><button class="tab active">市場總覽</button><button class="tab">台股</button><button class="tab">美股</button><button class="tab">財報行事曆</button></div><div class="market" id="market"></div><div class="section"><h2>⭐ 核心追蹤｜基本面分數</h2><div class="stocks" id="stocks"></div></div><div class="section"><h2>🚨 今日研究提醒</h2><div id="alerts" class="card"></div></div><div class="section"><h2>📅 接下來財報</h2><div class="card"><table><thead><tr><th>日期</th><th>股票</th><th>預期</th><th>資料狀態</th></tr></thead><tbody id="earnings"></tbody></table></div></div></section><section id="detail" class="detail"></section><div class="footer">資料原則：不把延遲資料標示成即時；不以單一 ROE 判定投資；ROE 會與 ROIC、槓桿、回購、EPS、自由現金流及估值交叉驗證。AI 結論是研究輔助，不是保證報酬或個別投資建議。</div></main><script>
const WATCH=[{s:'NVDA',n:'NVIDIA'},{s:'MSFT',n:'Microsoft'},{s:'AAPL',n:'Apple'},{s:'AMZN',n:'Amazon'},{s:'META',n:'Meta'},{s:'GOOGL',n:'Alphabet'},{s:'2330.TW',n:'台積電'},{s:'2317.TW',n:'鴻海'},{s:'2454.TW',n:'聯發科'}];let DATA={quotes:{},fundamentals:{},earnings:[]};const $=id=>document.getElementById(id);function pct(v){return v==null?'—':(Number(v)*100).toFixed(1)+'%'}function num(v){return v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}function score(f){if(!f)return{total:null,label:'資料不足'};let p=[];if(f.roe!=null)p.push(Math.min(100,Math.max(0,f.roe*2.5)));if(f.roic!=null)p.push(Math.min(100,Math.max(0,f.roic*2.2)));if(f.epsGrowth!=null)p.push(Math.min(100,Math.max(0,50+f.epsGrowth*150)));if(f.fcfGrowth!=null)p.push(Math.min(100,Math.max(0,50+f.fcfGrowth*100)));if(f.pe!=null&&f.pe>0)p.push(f.pe<20?90:f.pe<30?75:f.pe<40?55:35);if(!p.length)return{total:null,label:'資料不足'};let t=Math.round(p.reduce((a,b)=>a+b,0)/p.length);return{total:t,label:t>=85?'🟢 優質成長':t>=70?'🟢 值得研究':t>=55?'🟡 觀察／估值':'🔴 基本面風險'}}function render(){const ms=[['S&P 500','—','等待行情來源'],['NASDAQ','—','等待行情來源'],['台灣加權','—','等待行情來源'],['VIX','—','等待行情來源']];$('market').innerHTML=ms.map(x=>`<div class="card"><div class="muted">${x[0]}</div><b>${x[1]}</b><div class="muted">${x[2]}</div></div>`).join('');$('stocks').innerHTML=WATCH.map(w=>{let f=DATA.fundamentals[w.s],q=DATA.quotes[w.s],sc=score(f);return`<div class="card stock" data-symbol="${w.s}"><div class="stock-head"><div><div class="ticker">${w.s}</div><div class="muted">${w.n}</div></div><div class="score">${sc.total??'—'}</div></div><div style="margin:10px 0"><b>${q?.price!=null?num(q.price):'—'}</b> <span class="muted">${q?.asOf||'尚無行情時間戳'}</span></div><div class="bars">${[['ROE',f?.roe],['ROIC',f?.roic],['EPS成長',f?.epsGrowth],['FCF成長',f?.fcfGrowth]].map(([k,v])=>`<div class="barrow"><span>${k}</span><span class="bar"><i style="width:${v==null?0:Math.min(100,Math.max(0,Number(v)*100))}%"></i></span><span>${v==null?'—':pct(v)}</span></div>`).join('')}</div><div class="muted" style="margin-top:10px">${sc.label}</div></div>`}).join('');$('earnings').innerHTML=(DATA.earnings||[]).slice(0,15).map(e=>`<tr><td>${e.date||'—'}</td><td><b>${e.symbol||'—'}</b></td><td>${e.estimate||'—'}</td><td>${e.source?'已標來源':'待確認'}</td></tr>`).join('')||'<tr><td colspan="4">尚未取得財報日曆。未連接 API 時不顯示猜測日期。</td></tr>';$('alerts').innerHTML='<div class="note"><b>資料完整性優先</b><br>沒有有效行情／財報來源時顯示「—」，不使用示範數字或過期數字填補。</div>'}async function load(){try{let r=await fetch('/.netlify/functions/market-summary');if(!r.ok)throw Error('function');let d=await r.json();DATA=d;if(d.error){$('dataStatus').textContent='資料服務尚未完成設定：不顯示假資料';$('dot').className='dot bad'}else{$('dataStatus').textContent=`資料服務正常｜更新：${d.updatedAt||'—'}`;$('dot').className='dot ok'}render()}catch(e){$('dataStatus').textContent='尚未連接資料 API｜目前不使用示範行情';$('dot').className='dot bad';render()}}function showDetail(sym){let w=WATCH.find(x=>x.s===sym),f=DATA.fundamentals[sym],q=DATA.quotes[sym],sc=score(f);$('home').style.display='none';let d=$('detail');d.className='detail show';d.innerHTML=`<button class="back" onclick="back()">← 返回市場</button><div class="section"><div class="card"><h1>${w?.n||sym} <span class="muted">${sym}</span></h1><div class="metric"><div>股價<strong>${q?.price==null?'—':num(q.price)}</strong></div><div>ROE<strong>${pct(f?.roe)}</strong></div><div>ROIC<strong>${pct(f?.roic)}</strong></div><div>PE<strong>${f?.pe==null?'—':num(f.pe)}</strong></div><div>AI分數<strong>${sc.total??'—'}</strong></div></div></div></div><div class="section"><div class="card"><h2>基本面因果鏈</h2><div class="note">${sc.label}<br><br>ROE 高本身不是買進訊號。系統會檢查獲利能力、資產效率、資本結構、EPS／FCF 成長與估值；資料衝突時降級為「資料不足／需人工覆核」。</div></div></div><div class="section"><div class="card"><h2>資料時間戳與來源</h2><p class="muted">行情：${q?.asOf||'—'}<br>財務資料：${f?.asOf||'—'}<br>來源：${f?.source||q?.source||'—'}</p></div></div>`}function back(){$('detail').className='detail';$('home').style.display='block'}document.addEventListener('click',e=>{let s=e.target.closest('.stock');if(s)showDetail(s.dataset.symbol)});$('search').addEventListener('input',e=>{let v=e.target.value.toUpperCase();document.querySelectorAll('.stock').forEach(x=>x.style.display=x.textContent.toUpperCase().includes(v)?'block':'none')});load();
</script></body></html>
